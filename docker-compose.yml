services:
  bot:
    build: .
    container_name: elvia_bot
    restart: unless-stopped

    env_file:
      - .env

    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0

    volumes:
      - ./data:/app/data

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: elvia_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

    volumes:
      - redis_data:/data

volumes:
  redis_data: